<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top Voted Edits</title>
<style>

  :root{
    --bg:#0e1116; --panel:#161b22; --border:#2a313c;
    --text:#dbe1e8; --muted:#7d8896; --accent:#ff8a3d;
    --accent-dim:#5a3a22; --applied:#3fb950; --open:#58a6ff; --other:#9e7bd6;
    --row-hover:#1c232c; --mono:"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text); margin:0; padding:24px;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  h1{
    font-size:18px; font-weight:600; margin:0 0 4px; letter-spacing:.2px;
  }
  .sub{color:var(--muted); margin:0 0 18px; font-size:12.5px;}
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:16px; margin-bottom:16px;
  }
  .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .row + .row{margin-top:10px;}
  label{color:var(--muted); font-size:12px; margin-right:6px;}
  input[type=text], select, input[type=number]{
    background:#0b0e13; border:1px solid var(--border); color:var(--text);
    padding:6px 10px; border-radius:6px; font-size:13px; font-family:inherit;
  }
  input[type=text]:focus, select:focus{outline:1px solid var(--accent); border-color:var(--accent);}
  button{
    background:#1f2630; border:1px solid var(--border); color:var(--text);
    padding:6px 12px; border-radius:6px; font-size:12.5px; cursor:pointer;
  }
  button:hover{border-color:var(--accent); color:var(--accent);}
  button:disabled{opacity:.35; cursor:default; border-color:var(--border); color:var(--muted);}
  .stats{display:flex; gap:22px; flex-wrap:wrap;}
  .stat{min-width:90px;}
  .stat .n{font-family:var(--mono); font-size:19px; font-weight:600;}
  .stat .l{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px;}
  table{width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed;}
  thead th{
    text-align:left; padding:9px 10px; color:var(--muted); font-weight:600;
    font-size:11.5px; text-transform:uppercase; letter-spacing:.4px;
    border-bottom:1px solid var(--border); cursor:pointer; user-select:none;
    white-space:nowrap; position:sticky; top:0; background:var(--panel);
  }
  thead th:hover{color:var(--text);}
  thead th.active{color:var(--accent);}
  tbody td{padding:8px 10px; border-bottom:1px solid #1d242e; font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  tbody tr:hover{background:var(--row-hover);}
  tbody tr.empty td{font-family:inherit; color:var(--muted); text-align:center; padding:30px;}
  a{color:var(--text); text-decoration:none;}
  a:hover{color:var(--accent); text-decoration:underline;}
  .bar-cell{display:flex; align-items:center; gap:8px;}
  .bar-track{width:90px; height:6px; background:#1d242e; border-radius:3px; overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg,var(--accent-dim),var(--accent));}
  .badge{
    display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px;
    font-family:inherit; font-weight:600;
  }
  .badge.applied{background:#13301c; color:var(--applied);}
  .badge.open{background:#102233; color:var(--open);}
  .badge.failed{background:#3a1414; color:#ff7b7b;}
  .badge.cancelled{background:#262b33; color:var(--muted);}
  .badge.other{background:#2a2240; color:var(--other);}
  .count-pill{
    font-family:var(--mono); font-size:12px; color:var(--muted);
  }
  .footer-note{color:var(--muted); font-size:11.5px; margin-top:10px;}


table{
  min-width:1400px;
}
.vote-yes{color:#3fb950;font-weight:600;}
.vote-no{color:#ff7b7b;font-weight:600;}
.vote-abstain{color:#9e7bd6;}
</style>
</head>

<body>

<h1>Top Voted Edits</h1>
<p class="sub">
MusicBrainz edits ranked by current votes.
Changed/superseded votes are excluded.<br>
<span id="lastUpdated">Data snapshot: loading&hellip;</span>
</p>

<div class="panel" id="statusPanel">
  <p id="statusText"
     style="margin:0;color:var(--muted);text-align:center;padding:20px 0;">
    Loading votes&hellip;
  </p>
</div>

<div class="panel" id="statsPanel" style="display:none">
  <div class="stats">
    <div class="stat">
      <div class="n" id="statTotal">-</div>
      <div class="l">Edits loaded</div>
    </div>

    <div class="stat">
      <div class="n" id="statShown">-</div>
      <div class="l">Shown</div>
    </div>

    <div class="stat">
      <div class="n" id="statMaxTotal">-</div>
      <div class="l">Max total</div>
    </div>

    <div class="stat">
      <div class="n" id="statMaxYes">-</div>
      <div class="l">Max yes</div>
    </div>

    <div class="stat">
      <div class="n" id="statMaxNo">-</div>
      <div class="l">Max no</div>
    </div>
  </div>
</div>

<div class="panel" id="controlsPanel" style="display:none">
  <div class="row">

    <div>
      <label for="search">Search</label>
      <input
        type="text"
        id="search"
        placeholder="edit, editor, or type"
        style="width:220px">
    </div>

    <div>
      <label for="sortSelect">Sort by</label>
      <select id="sortSelect">
        <option value="total_votes">Total votes</option>
        <option value="yes_votes">Yes votes</option>
        <option value="no_votes">No votes</option>
        <option value="abstain_votes">Abstain votes</option>
        <option value="approve_votes">Approve votes</option>
        <option value="admin_approve_votes">Admin approve</option>
        <option value="admin_reject_votes">Admin reject</option>
        <option value="open_time">Opened</option>
      </select>
    </div>

    <div>
      <label for="statusFilter">Status</label>
      <select id="statusFilter">
        <option value="">All</option>
        <option value="2">Applied</option>
        <option value="1">Open</option>
        <option value="3">Failed vote</option>
        <option value="4">Failed dependency</option>
        <option value="5">Error</option>
        <option value="6">Failed prerequisite</option>
        <option value="9">Cancelled</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div>
      <label for="typeFilter">Edit type</label>
      <select id="typeFilter">
        <option value="">All types</option>
      </select>
    </div>

    <div>
      <label for="minVotes">Min votes</label>
      <input
        type="number"
        id="minVotes"
        placeholder="0"
        min="0"
        style="width:80px">
    </div>

    <div>
      <label for="yearFilter">Year</label>
      <select id="yearFilter">
        <option value="">All years</option>
      </select>
    </div>

    <div style="margin-left:auto">
      <button id="exportCsv">Export CSV</button>
    </div>

  </div>
</div>

<div
  class="panel"
  id="tablePanel"
  style="display:none;overflow:auto;max-height:75vh;padding:0">

<table>
  <thead>
    <tr>
      <th data-key="_rank">#</th>
      <th data-key="edit_id">Edit</th>
      <th data-key="total_votes">Total</th>
      <th data-key="yes_votes">Yes</th>
      <th data-key="no_votes">No</th>
      <th data-key="abstain_votes">Abstain</th>
      <th data-key="approve_votes">Approve</th>
      <th data-key="admin_approve_votes">Admin +</th>
      <th data-key="admin_reject_votes">Admin −</th>
      <th data-key="editor_id">Editor</th>
      <th data-key="edit_type">Type</th>
      <th data-key="edit_status">Status</th>
      <th data-key="open_time">Opened</th>
    </tr>
  </thead>

  <tbody id="tbody"></tbody>
</table>

</div>

<div
  class="row"
  id="paginationRow"
  style="display:none;justify-content:space-between">

  <span class="count-pill" id="pageInfo"></span>

  <div>
    <button id="prevPage">&larr; Prev</button>
    <button id="nextPage">Next &rarr;</button>
  </div>
</div>

<p class="footer-note" id="footerNote"></p>

<script>
let rows = [];
let editorNames = {};
let sortKey = "total_votes";
let sortDir = -1;
let currentPage = 1;

const PAGE_SIZE = 100;
const $ = id => document.getElementById(id);

const STATUS_INFO = {
  1: {label:"open", cls:"open"},
  2: {label:"applied", cls:"applied"},
  3: {label:"failed vote", cls:"failed"},
  4: {label:"failed dependency", cls:"failed"},
  5: {label:"error", cls:"failed"},
  6: {label:"failed prerequisite", cls:"failed"},
  9: {label:"cancelled", cls:"cancelled"},
};

const EDIT_TYPE_NAMES = {
  "1": "Add artist", "2": "Edit artist", "3": "Remove artist", "4": "Merge artists",
  "5": "Add artist annotation", "6": "Add artist alias", "7": "Remove artist alias",
  "8": "Edit artist alias", "9": "Edit artist credit",
  "10": "Add label", "11": "Edit label", "13": "Remove label", "14": "Merge labels",
  "15": "Add label annotation", "16": "Add label alias", "17": "Remove label alias",
  "18": "Edit label alias",
  "20": "Add release group", "21": "Edit release group", "22": "Set release group cover art",
  "23": "Remove release group", "24": "Merge release groups", "25": "Add release group annotation",
  "26": "Add release group alias", "27": "Remove release group alias", "28": "Edit release group alias",
  "31": "Add release", "32": "Edit release", "33": "Move release", "34": "Add release label",
  "35": "Add release annotation", "36": "Remove release label", "37": "Edit release label",
  "38": "Change release quality", "39": "Edit release barcodes",
  "310": "Remove release", "311": "Merge releases", "312": "Edit release artist",
  "313": "Reorder mediums", "314": "Add cover art", "315": "Remove cover art",
  "316": "Edit cover art", "317": "Reorder cover art", "318": "Add release alias",
  "319": "Remove release alias", "320": "Edit release alias",
  "41": "Add work", "42": "Edit work", "43": "Remove work", "44": "Merge works",
  "45": "Add work annotation", "46": "Add work alias", "47": "Remove work alias",
  "48": "Edit work alias", "49": "Add ISWCs", "410": "Remove ISWC",
  "51": "Add medium", "52": "Edit medium", "53": "Remove medium", "54": "Remove Disc ID",
  "55": "Add Disc ID", "56": "Move Disc ID", "58": "Set track lengths",
  "61": "Add place", "62": "Edit place", "63": "Remove place", "64": "Merge places",
  "65": "Add place annotation", "66": "Add place alias", "67": "Remove place alias",
  "68": "Edit place alias",
  "71": "Add recording", "72": "Edit recording", "73": "Remove recording",
  "74": "Merge recordings", "75": "Add recording annotation", "76": "Add ISRCs",
  "78": "Remove ISRC", "711": "Add recording alias", "712": "Remove recording alias",
  "713": "Edit recording alias",
  "81": "Add area", "82": "Edit area", "83": "Remove area", "84": "Merge areas",
  "85": "Add area annotation", "86": "Add area alias", "87": "Remove area alias",
  "88": "Edit area alias",
  "90": "Add relationship", "91": "Edit relationship", "92": "Remove relationship",
  "93": "Remove relationship type", "94": "Remove relationship attribute",
  "95": "Edit relationship type", "96": "Add relationship type", "97": "Edit relationship attribute",
  "98": "Add relationship attribute", "99": "Reorder relationships",
  "101": "Edit URL", "120": "Change WikiDoc",
  "131": "Add instrument", "132": "Edit instrument", "133": "Remove instrument",
  "134": "Merge instruments", "135": "Add instrument annotation", "136": "Add instrument alias",
  "137": "Remove instrument alias", "138": "Edit instrument alias",
  "140": "Add series", "141": "Edit series", "142": "Remove series", "143": "Merge series",
  "144": "Add series annotation", "145": "Add series alias", "146": "Remove series alias",
  "147": "Edit series alias",
  "150": "Add event", "151": "Edit event", "152": "Remove event", "153": "Merge events",
  "154": "Add event annotation", "155": "Add event alias", "156": "Remove event alias",
  "157": "Edit event alias", "158": "Add event art", "159": "Remove event art",
  "1510": "Edit event art", "1511": "Reorder event art",
  "160": "Add genre", "161": "Edit genre", "162": "Remove genre", "164": "Add genre annotation",
  "165": "Add genre alias", "166": "Remove genre alias", "167": "Edit genre alias",
};

function esc(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function parseDate(s){
  if(!s) return null;

  const iso = s
    .replace(" ", "T")
    .replace(/([+-]\d{2})$/, "$1:00");

  const d = new Date(iso);
  return isNaN(d) ? null : d;
}

function openYear(r){
  return r.open_time ? r.open_time.slice(0,4) : null;
}

function editTypeName(r){
  return EDIT_TYPE_NAMES[r.edit_type] || null;
}

function editorName(r){
  if(r.editor_id == null) return null;
  return editorNames[String(r.editor_id)] || null;
}

function editorUrl(name){
  return `https://musicbrainz.org/user/${encodeURIComponent(name)}`;
}

function statusBadge(row){
  const info = STATUS_INFO[row.edit_status];

  if(info){
    return `<span class="badge ${info.cls}">${esc(info.label)}</span>`;
  }

  return `<span class="badge other">status ${esc(row.edit_status ?? "?")}</span>`;
}

function maxValue(key){
  let max = 0;

  for(const r of rows){
    const value = Number(r[key]) || 0;
    if(value > max) max = value;
  }

  return max;
}

function loadData(json){
  currentPage = 1;

  rows = json.map(r => ({
    ...r,
    _openDate: parseDate(r.open_time),
    _year: openYear(r),
  }));

  const years = [
    ...new Set(
      rows
        .map(r => r._year)
        .filter(Boolean)
    )
  ].sort((a,b) => b - a);

  $("yearFilter").innerHTML =
    '<option value="">All years</option>' +
    years
      .map(y => `<option value="${esc(y)}">${esc(y)}</option>`)
      .join("");

  const typeCounts = new Map();

  for(const r of rows){
    const key = String(r.edit_type ?? "");
    if(!key) continue;

    typeCounts.set(
      key,
      (typeCounts.get(key) || 0) + 1
    );
  }

  const typeEntries = [...typeCounts.entries()]
    .sort((a,b) => b[1] - a[1]);

  $("typeFilter").innerHTML =
    '<option value="">All types</option>' +
    typeEntries.map(([code,count]) => {
      const name = EDIT_TYPE_NAMES[code] || `Type ${code}`;

      return (
        `<option value="${esc(code)}">` +
        `${esc(name)} (${count.toLocaleString()})` +
        `</option>`
      );
    }).join("");

  $("statusPanel").style.display = "none";
  $("statsPanel").style.display = "block";
  $("controlsPanel").style.display = "block";
  $("tablePanel").style.display = "block";

  $("footerNote").textContent =
    "Click a row to open the edit on MusicBrainz. " +
    "Click any column header to sort.";

  render();
}

function getFiltered(){
  const q = $("search").value.trim().toLowerCase();
  const statusVal = $("statusFilter").value;
  const typeVal = $("typeFilter").value;
  const yearVal = $("yearFilter").value;
  const minVotes = parseInt($("minVotes").value, 10);

  return rows.filter(r => {

    if(q){
      const typeName = (editTypeName(r) || "").toLowerCase();
      const edName = (editorName(r) || "").toLowerCase();

      const hit =
        String(r.edit_id).includes(q) ||
        String(r.editor_id ?? "").includes(q) ||
        typeName.includes(q) ||
        edName.includes(q);

      if(!hit) return false;
    }

    if(statusVal){
      if(statusVal === "other"){
        if(STATUS_INFO[r.edit_status]) return false;
      }
      else if(String(r.edit_status) !== statusVal){
        return false;
      }
    }

    if(typeVal && String(r.edit_type) !== typeVal){
      return false;
    }

    if(yearVal && r._year !== yearVal){
      return false;
    }

    if(!isNaN(minVotes) && r.total_votes < minVotes){
      return false;
    }

    return true;
  });
}

function compareRows(a,b){
  let av;
  let bv;

  if(sortKey === "open_time"){
    av = a._openDate;
    bv = b._openDate;
  }
  else{
    av = a[sortKey];
    bv = b[sortKey];
  }

  if(av == null && bv == null) return 0;
  if(av == null) return 1;
  if(bv == null) return -1;

  if(av < bv) return -1 * sortDir;
  if(av > bv) return 1 * sortDir;

  // Stable useful tiebreaker.
  if(a.edit_id < b.edit_id) return 1;
  if(a.edit_id > b.edit_id) return -1;

  return 0;
}

function render(){
  const filtered = getFiltered();
  filtered.sort(compareRows);

  $("statTotal").textContent =
    rows.length.toLocaleString();

  $("statShown").textContent =
    filtered.length.toLocaleString();

  $("statMaxTotal").textContent =
    maxValue("total_votes").toLocaleString();

  $("statMaxYes").textContent =
    maxValue("yes_votes").toLocaleString();

  $("statMaxNo").textContent =
    maxValue("no_votes").toLocaleString();

  $("sortSelect").value = sortKey;

  document.querySelectorAll("thead th").forEach(th => {
    th.classList.toggle(
      "active",
      th.dataset.key === sortKey
    );
  });

  const tbody = $("tbody");

  if(!filtered.length){
    tbody.innerHTML =
      '<tr class="empty">' +
      '<td colspan="13">No edits match the current filters.</td>' +
      '</tr>';

    $("paginationRow").style.display = "none";
    return;
  }

  const totalPages = Math.max(
    1,
    Math.ceil(filtered.length / PAGE_SIZE)
  );

  currentPage = Math.min(
    Math.max(1,currentPage),
    totalPages
  );

  const startIdx = (currentPage - 1) * PAGE_SIZE;
  const endIdx = Math.min(
    startIdx + PAGE_SIZE,
    filtered.length
  );

  const pageRows = filtered.slice(
    startIdx,
    endIdx
  );

  if(filtered.length > PAGE_SIZE){
    $("paginationRow").style.display = "flex";

    $("pageInfo").textContent =
      `Showing ${(startIdx+1).toLocaleString()}-` +
      `${endIdx.toLocaleString()} of ` +
      `${filtered.length.toLocaleString()} ` +
      `(page ${currentPage} of ${totalPages})`;

    $("prevPage").disabled = currentPage <= 1;
    $("nextPage").disabled = currentPage >= totalPages;
  }
  else{
    $("paginationRow").style.display = "none";
  }

  tbody.innerHTML = pageRows.map((r,index) => {

    const edName = editorName(r);

    const editorHtml = edName
      ? `<a href="${editorUrl(edName)}" target="_blank" rel="noopener">${esc(edName)}</a>`
      : (
          r.editor_id != null
            ? `Editor #${esc(r.editor_id)}`
            : "-"
        );

    const typeName =
      editTypeName(r) ||
      (
        r.edit_type != null
          ? `Type ${r.edit_type}`
          : "-"
      );

    return `
      <tr data-url="${esc(r.url)}">

        <td>${(startIdx + index + 1).toLocaleString()}</td>

        <td>
          <a
            href="${esc(r.url)}"
            target="_blank"
            rel="noopener">
            ${esc(r.edit_id)}
          </a>
        </td>

        <td>${Number(r.total_votes || 0).toLocaleString()}</td>

        <td class="vote-yes">
          ${Number(r.yes_votes || 0).toLocaleString()}
        </td>

        <td class="vote-no">
          ${Number(r.no_votes || 0).toLocaleString()}
        </td>

        <td class="vote-abstain">
          ${Number(r.abstain_votes || 0).toLocaleString()}
        </td>

        <td>
          ${Number(r.approve_votes || 0).toLocaleString()}
        </td>

        <td>
          ${Number(r.admin_approve_votes || 0).toLocaleString()}
        </td>

        <td>
          ${Number(r.admin_reject_votes || 0).toLocaleString()}
        </td>

        <td title="editor #${esc(r.editor_id ?? "?")}">
          ${editorHtml}
        </td>

        <td title="type ${esc(r.edit_type ?? "?")}">
          ${esc(typeName)}
        </td>

        <td>
          ${statusBadge(r)}
        </td>

        <td>
          ${r.open_time ? esc(r.open_time.slice(0,10)) : "-"}
        </td>

      </tr>
    `;
  }).join("");

  tbody.querySelectorAll("tr[data-url]").forEach(tr => {
    tr.addEventListener("click", e => {
      if(e.target.tagName === "A") return;
      window.open(tr.dataset.url, "_blank");
    });
  });
}

document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;

    if(key === "_rank") return;

    if(sortKey === key){
      sortDir *= -1;
    }
    else{
      sortKey = key;

      sortDir =
        key === "edit_id" ||
        key === "editor_id" ||
        key === "edit_type"
          ? 1
          : -1;
    }

    currentPage = 1;
    render();
  });
});

$("sortSelect").addEventListener("change", () => {
  sortKey = $("sortSelect").value;
  sortDir = -1;
  currentPage = 1;
  render();
});

[
  "search",
  "statusFilter",
  "typeFilter",
  "minVotes",
  "yearFilter",
].forEach(id => {

  $(id).addEventListener("input", () => {
    currentPage = 1;
    render();
  });

  $(id).addEventListener("change", () => {
    currentPage = 1;
    render();
  });

});

$("prevPage").addEventListener("click", () => {
  currentPage--;
  render();
});

$("nextPage").addEventListener("click", () => {
  currentPage++;
  render();
});

$("exportCsv").addEventListener("click", () => {

  const filtered = getFiltered();
  filtered.sort(compareRows);

  const cols = [
    "edit_id",
    "total_votes",
    "yes_votes",
    "no_votes",
    "abstain_votes",
    "approve_votes",
    "admin_approve_votes",
    "admin_reject_votes",
    "editor_id",
    "editor_name",
    "edit_type",
    "edit_type_name",
    "edit_status",
    "open_time",
    "close_time",
    "url",
  ];

  const lines = [cols.join(",")];

  for(const r of filtered){

    const enriched = {
      ...r,
      editor_name: editorName(r) || "",
      edit_type_name: editTypeName(r) || "",
    };

    lines.push(
      cols.map(c => {
        const value = enriched[c] ?? "";
        const str = String(value);

        if(
          str.includes(",") ||
          str.includes('"') ||
          str.includes("\n")
        ){
          return `"${str.replaceAll('"','""')}"`;
        }

        return str;
      }).join(",")
    );
  }

  const blob = new Blob(
    [lines.join("\n")],
    {type:"text/csv"}
  );

  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = "top_voted_edits_filtered.csv";
  a.click();

  URL.revokeObjectURL(a.href);
});

async function tryAutoLoad(){

  try{
    const mr = await fetch("meta.json");

    if(mr.ok){
      const meta = await mr.json();

      if(meta.snapshot_date){
        const parts = meta.snapshot_date.split("-");

        const d = new Date(
          Number(parts[0]),
          Number(parts[1]) - 1,
          Number(parts[2])
        );

        $("lastUpdated").textContent =
          "Data snapshot: " +
          d.toLocaleDateString(undefined, {
            year: "numeric",
            month: "long",
            day: "numeric"
          });
      }
    }
  }
  catch(e){
    $("lastUpdated").textContent = "Data snapshot unavailable";
  }

  try{
    const er = await fetch("editors.json");

    if(er.ok){
      editorNames = await er.json();
    }
  }
  catch(e){
    // Names are optional.
  }

  try{
    const vr = await fetch("votes.json");

    if(!vr.ok){
      throw new Error(`HTTP ${vr.status}`);
    }

    const data = await vr.json();
    loadData(data);
  }
  catch(e){
    $("statusText").innerHTML =
      "Could not load <code>votes.json</code><br><br>" +
      `<span style="color:#ff7b7b">${esc(e.message)}</span>`;
  }
}

tryAutoLoad();
</script>

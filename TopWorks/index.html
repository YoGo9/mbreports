<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicBrainz Reports</title>

<style>
:root {
    --bg: #111418;
    --panel: #1a1f25;
    --panel2: #222831;
    --border: #303843;
    --text: #eef2f6;
    --muted: #98a3af;
    --accent: #ba478f;
    --link: #76b7ff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

header {
    padding: 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
}

header h1 {
    margin: 0 0 6px;
    font-size: 26px;
}

header p {
    margin: 0;
    color: var(--muted);
}

main {
    max-width: 1500px;
    margin: auto;
    padding: 22px;
}

.filters {
    display: grid;
    grid-template-columns: 2fr 2fr 1.2fr 1.5fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
}

input,
select {
    width: 100%;
    padding: 10px 12px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
}

.stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin: 14px 0;
    color: var(--muted);
}

.stats strong {
    color: var(--text);
}

.table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
}

th,
td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
}

th {
    background: var(--panel2);
    position: sticky;
    top: 0;
    cursor: pointer;
    white-space: nowrap;
}

tr:hover td {
    background: #20262d;
}

a {
    color: var(--link);
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.rank {
    color: var(--muted);
    width: 70px;
}

.recording-count {
    font-weight: 700;
    text-align: right;
}

.artist-entry {
    margin-bottom: 6px;
}

.relationship {
    color: var(--muted);
    font-size: 12px;
}

.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px 0;
}

button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
}

button:hover:not(:disabled) {
    border-color: var(--accent);
}

button:disabled {
    opacity: .4;
    cursor: default;
}

.loading {
    padding: 60px;
    text-align: center;
    color: var(--muted);
}

@media (max-width: 1000px) {
    .filters {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 550px) {
    .filters {
        grid-template-columns: 1fr;
    }

    main {
        padding: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>MusicBrainz Reports</h1>
    <p>Works With the Most Recordings</p>
</header>

<main>

<div class="filters">

    <input
        id="workSearch"
        type="search"
        placeholder="Search work..."
    >

    <input
        id="artistSearch"
        type="search"
        placeholder="Search writer / composer..."
    >

    <select id="typeFilter">
        <option value="">All work types</option>
    </select>

    <select id="areaFilter">
        <option value="">All artist areas</option>
    </select>

    <input
        id="minRecordings"
        type="number"
        min="10"
        value="10"
        placeholder="Min recordings"
    >

    <select id="pageSize">
        <option value="25">25 per page</option>
        <option value="50" selected>50 per page</option>
        <option value="100">100 per page</option>
        <option value="250">250 per page</option>
    </select>

</div>

<div class="stats">
    <span>Showing <strong id="resultCount">0</strong> works</span>
    <span>Dataset: <strong id="datasetCount">0</strong></span>
    <span>Generated: <strong id="generatedAt">...</strong></span>
</div>

<div class="table-wrap">

<table>
<thead>
<tr>
    <th data-sort="rank">#</th>
    <th data-sort="work">Work</th>
    <th data-sort="work_type">Type</th>
    <th data-sort="artist">Writer / Composer</th>
    <th data-sort="area">Artist Area</th>
    <th data-sort="recording_count">Recordings</th>
</tr>
</thead>

<tbody id="results">
<tr>
    <td colspan="6" class="loading">
        Loading report...
    </td>
</tr>
</tbody>

</table>

</div>

<div class="pagination">
    <button id="prev">Previous</button>
    <span id="pageInfo"></span>
    <button id="next">Next</button>
</div>

</main>

<script>
let allData = [];
let filteredData = [];

let page = 1;
let pageSize = 50;

let sortField = "recording_count";
let sortDirection = "desc";

const workSearch = document.getElementById("workSearch");
const artistSearch = document.getElementById("artistSearch");
const typeFilter = document.getElementById("typeFilter");
const areaFilter = document.getElementById("areaFilter");
const minRecordings = document.getElementById("minRecordings");
const pageSizeSelect = document.getElementById("pageSize");

const tbody = document.getElementById("results");

const resultCount = document.getElementById("resultCount");
const datasetCount = document.getElementById("datasetCount");
const generatedAt = document.getElementById("generatedAt");

const prev = document.getElementById("prev");
const next = document.getElementById("next");
const pageInfo = document.getElementById("pageInfo");


function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function getAreas(row) {
    return [...new Set(
        (row.artists || [])
            .map(a => a.area)
            .filter(Boolean)
    )];
}


function getArtistNames(row) {
    return (row.artists || [])
        .map(a => a.credited_name || a.name || "")
        .filter(Boolean);
}


function populateFilters() {
    const types = new Set();
    const areas = new Set();

    for (const row of allData) {
        if (row.work_type)
            types.add(row.work_type);

        for (const area of getAreas(row))
            areas.add(area);
    }

    [...types]
        .sort((a, b) => a.localeCompare(b))
        .forEach(type => {
            const option = document.createElement("option");
            option.value = type;
            option.textContent = type;
            typeFilter.appendChild(option);
        });

    [...areas]
        .sort((a, b) => a.localeCompare(b))
        .forEach(area => {
            const option = document.createElement("option");
            option.value = area;
            option.textContent = area;
            areaFilter.appendChild(option);
        });
}


function applyFilters() {
    const workText =
        workSearch.value.trim().toLowerCase();

    const artistText =
        artistSearch.value.trim().toLowerCase();

    const type =
        typeFilter.value;

    const area =
        areaFilter.value;

    const minimum =
        Math.max(
            10,
            parseInt(minRecordings.value || "10", 10)
        );

    filteredData = allData.filter(row => {

        if (row.recording_count < minimum)
            return false;

        if (
            workText &&
            !(row.work || "")
                .toLowerCase()
                .includes(workText)
        )
            return false;

        if (
            type &&
            row.work_type !== type
        )
            return false;

        if (artistText) {
            const match =
                (row.artists || []).some(a =>
                    (a.name || "")
                        .toLowerCase()
                        .includes(artistText) ||
                    (a.credited_name || "")
                        .toLowerCase()
                        .includes(artistText)
                );

            if (!match)
                return false;
        }

        if (area) {
            const match =
                (row.artists || []).some(a =>
                    a.area === area
                );

            if (!match)
                return false;
        }

        return true;
    });

    sortData();

    page = 1;

    render();
}


function sortData() {
    filteredData.sort((a, b) => {
        let av;
        let bv;

        if (sortField === "recording_count") {
            av = a.recording_count;
            bv = b.recording_count;
        }
        else if (sortField === "artist") {
            av = getArtistNames(a).join(", ");
            bv = getArtistNames(b).join(", ");
        }
        else if (sortField === "area") {
            av = getAreas(a).join(", ");
            bv = getAreas(b).join(", ");
        }
        else {
            av = a[sortField] || "";
            bv = b[sortField] || "";
        }

        if (typeof av === "number") {
            return sortDirection === "asc"
                ? av - bv
                : bv - av;
        }

        const cmp =
            String(av).localeCompare(String(bv));

        return sortDirection === "asc"
            ? cmp
            : -cmp;
    });
}


function renderArtists(row) {
    if (!row.artists || !row.artists.length)
        return "—";

    return row.artists.map(a => {
        const displayName =
            escapeHtml(a.credited_name || a.name);

        const relationship =
            escapeHtml(a.relationship || "");

        return `
            <div class="artist-entry">
                <a
                    href="https://musicbrainz.org/artist/${a.mbid}"
                    target="_blank"
                    rel="noopener"
                >${displayName}</a>

                <div class="relationship">
                    ${relationship}
                </div>
            </div>
        `;
    }).join("");
}


function render() {
    const totalPages =
        Math.max(
            1,
            Math.ceil(filteredData.length / pageSize)
        );

    if (page > totalPages)
        page = totalPages;

    const start =
        (page - 1) * pageSize;

    const rows =
        filteredData.slice(
            start,
            start + pageSize
        );

    if (!rows.length) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="loading">
                    No matching works
                </td>
            </tr>
        `;
    }
    else {
        tbody.innerHTML =
            rows.map((row, index) => {

                const rank =
                    start + index + 1;

                const areas =
                    getAreas(row);

                return `
                <tr>

                    <td class="rank">
                        ${rank.toLocaleString()}
                    </td>

                    <td>
                        <a
                            href="https://musicbrainz.org/work/${row.work_mbid}"
                            target="_blank"
                            rel="noopener"
                        >
                            ${escapeHtml(row.work)}
                        </a>
                    </td>

                    <td>
                        ${escapeHtml(row.work_type || "Unknown")}
                    </td>

                    <td>
                        ${renderArtists(row)}
                    </td>

                    <td>
                        ${
                            areas.length
                                ? areas
                                    .map(escapeHtml)
                                    .join("<br>")
                                : "—"
                        }
                    </td>

                    <td class="recording-count">
                        ${row.recording_count.toLocaleString()}
                    </td>

                </tr>
                `;
            }).join("");
    }

    resultCount.textContent =
        filteredData.length.toLocaleString();

    pageInfo.textContent =
        `Page ${page.toLocaleString()} of ${totalPages.toLocaleString()}`;

    prev.disabled =
        page <= 1;

    next.disabled =
        page >= totalPages;
}


let filterTimer;

function delayedFilter() {
    clearTimeout(filterTimer);

    filterTimer =
        setTimeout(applyFilters, 150);
}


workSearch.addEventListener(
    "input",
    delayedFilter
);

artistSearch.addEventListener(
    "input",
    delayedFilter
);

minRecordings.addEventListener(
    "input",
    delayedFilter
);

typeFilter.addEventListener(
    "change",
    applyFilters
);

areaFilter.addEventListener(
    "change",
    applyFilters
);

pageSizeSelect.addEventListener(
    "change",
    () => {
        pageSize =
            parseInt(pageSizeSelect.value, 10);

        page = 1;
        render();
    }
);


prev.addEventListener(
    "click",
    () => {
        if (page > 1) {
            page--;
            render();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    }
);


next.addEventListener(
    "click",
    () => {
        const pages =
            Math.ceil(
                filteredData.length /
                pageSize
            );

        if (page < pages) {
            page++;
            render();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    }
);


document
    .querySelectorAll("th[data-sort]")
    .forEach(th => {

        th.addEventListener(
            "click",
            () => {

                const field =
                    th.dataset.sort;

                if (field === "rank")
                    return;

                if (sortField === field) {
                    sortDirection =
                        sortDirection === "asc"
                            ? "desc"
                            : "asc";
                }
                else {
                    sortField = field;

                    sortDirection =
                        field === "recording_count"
                            ? "desc"
                            : "asc";
                }

                sortData();

                page = 1;

                render();
            }
        );
    });


async function loadData() {
    try {
        const response =
            await fetch("data/works.json");

        if (!response.ok)
            throw new Error(
                `HTTP ${response.status}`
            );

        const report =
            await response.json();

        allData =
            report.data || [];

        filteredData =
            [...allData];

        datasetCount.textContent =
            Number(report.count || allData.length)
                .toLocaleString();

        generatedAt.textContent =
            report.generated_at
                ? new Date(
                    report.generated_at
                ).toLocaleString()
                : "Unknown";

        populateFilters();

        sortData();

        render();
    }
    catch (error) {
        console.error(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="loading">
                    Failed to load report data:
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;
    }
}

loadData();
</script>

</body>
</html>

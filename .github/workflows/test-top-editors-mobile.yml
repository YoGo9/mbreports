name: Test Top Editors mobile layout

on:
  push:
    branches: [fix-top-editors-mobile-layout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate script and mobile layout structure
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path("TopEditors/index.html").read_text()
          assert '<meta name="viewport"' in html
          assert "@media (max-width: 760px)" in html
          assert "grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)" in html
          assert '<select id="mobile-sort"' in html
          assert 'function applySort(col, direction)' in html
          keys = ['edits', 'rank_change', 'edits_change', 'release_groups_added',
                  'releases_added', 'artists_added', 'works_added']
          positions = [html.index(f'data-col="{key}"') for key in keys]
          assert positions == sorted(positions), positions
          assert html.count('id="mobile-sort"') == 1
          assert html.count('id="mobile-sort-dir"') == 1
          class Checker(HTMLParser):
              def error(self, message): raise AssertionError(message)
          Checker().feed(html)
          print("Mobile layout and contribution column order passed")
          code = html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/top-editors.js").write_text(code)
          PY
          node --check /tmp/top-editors.js
